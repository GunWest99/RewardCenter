<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reward Centre</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  body {
    color:#e6ecff; min-height:100vh; padding:20px;
    background: linear-gradient(-45deg, #0b0f1c, #1b2340, #2a1b4a, #10263d);
    background-size: 400% 400%;
    animation: gradientFlow 18s ease infinite;
  }
  @keyframes gradientFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  header {
    display:flex; justify-content:space-between; align-items:center;
    max-width:1200px; margin:0 auto 20px; flex-wrap:wrap; gap:15px;
  }
  .logo {
    font-size:28px; font-weight:800; letter-spacing:1px;
    background: linear-gradient(90deg, #7c5cff, #22d3ee, #a78bfa, #22d3ee);
    background-size: 300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: textFlow 8s ease infinite;
  }
  @keyframes textFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .balance {
    background:rgba(19,26,46,.7); padding:12px 22px; border-radius:14px;
    border:1px solid #26304d; font-weight:700; font-size:18px;
    display:flex; align-items:center; gap:10px;
    backdrop-filter: blur(10px);
  }
  .balance span { color:#22d3ee; }

  /* Верхняя панель управления */
  .top-panel {
    max-width:1200px; margin:0 auto 25px;
    display:flex; gap:15px; flex-wrap:wrap; justify-content:center;
    background:rgba(19,26,46,.6); padding:15px 20px; border-radius:16px;
    border:1px solid #26304d; backdrop-filter: blur(10px);
  }
  .top-panel .group {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .top-panel .label { color:#8b95b8; font-size:13px; font-weight:600; margin-right:4px; }
  .chip {
    padding:8px 14px; border-radius:10px; cursor:pointer; font-weight:700;
    font-size:14px; color:#c8d1f0;
    background:#1a2338; border:1px solid #26304d;
    transition:.2s; user-select:none;
  }
  .chip:hover { border-color:#7c5cff; color:#fff; }
  .chip.active {
    background:linear-gradient(90deg,#7c5cff,#22d3ee);
    color:#fff; border-color:transparent;
    box-shadow:0 5px 20px rgba(124,92,255,.4);
  }
  .chip.gold.active {
    background:linear-gradient(90deg,#f59e0b,#ef4444);
    box-shadow:0 5px 20px rgba(245,158,11,.4);
  }

  /* Сетка кейсов */
  .cases {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:20px; max-width:1200px; margin:0 auto;
  }
  .case {
    background:linear-gradient(160deg, rgba(20,27,48,.85), rgba(13,18,32,.85));
    border:1px solid #26304d; border-radius:18px; padding:20px;
    text-align:center; transition:.3s; position:relative; overflow:hidden;
    backdrop-filter: blur(6px);
  }
  .case::before {
    content:''; position:absolute; inset:0;
    background: linear-gradient(120deg, transparent 30%, rgba(124,92,255,.15) 50%, transparent 70%);
    background-size: 250% 100%;
    opacity:0; transition: opacity .4s;
    pointer-events:none;
  }
  .case:hover {
    transform:translateY(-5px);
    border-color:#7c5cff;
    box-shadow:0 15px 35px rgba(124,92,255,.3);
  }
  .case:hover::before { opacity:1; animation: shine 1.6s linear infinite; }
  @keyframes shine {
    0%   { background-position: 250% 0; }
    100% { background-position: -250% 0; }
  }

  .case .emoji { font-size:56px; margin-bottom:10px; display:inline-block;
    transition: transform .4s; }
  .case:hover .emoji { transform: scale(1.15) rotate(-5deg); }

  .case h3 { font-size:17px; margin-bottom:6px; }
  .case .price { color:#8b95b8; font-size:13px; margin-bottom:14px; }

  .case .btn-row { display:flex; gap:6px; }
  .case button {
    flex:1; padding:12px; border:none; border-radius:10px;
    background:linear-gradient(90deg,#7c5cff,#22d3ee,#7c5cff);
    background-size: 200% 100%;
    color:#fff; font-weight:700; cursor:pointer; font-size:15px;
    transition: .3s;
    animation: btnFlow 6s ease infinite;
  }
  @keyframes btnFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .case button:hover { filter:brightness(1.15); box-shadow:0 5px 20px rgba(34,211,238,.4); }
  .case button:disabled { opacity:.45; cursor:not-allowed; filter:none; animation:none; }

  .case button.fast {
    background:linear-gradient(90deg,#f59e0b,#ef4444);
    flex:0 0 45px; padding:12px 0; font-size:18px;
    animation: none;
  }
  .case button.fast:hover { box-shadow:0 5px 20px rgba(245,158,11,.5); }

  /* Модалка */
  .modal {
    position:fixed; inset:0; background:rgba(3,6,14,.85);
    display:none; align-items:center; justify-content:center;
    padding:20px; z-index:100;
    backdrop-filter: blur(6px);
  }
  .modal.show { display:flex; }
  .modal-box {
    background:linear-gradient(160deg,#0f1526,#141b30);
    border:1px solid #26304d; border-radius:20px;
    padding:30px; max-width:600px; width:100%; text-align:center;
    box-shadow: 0 25px 60px rgba(0,0,0,.5);
  }
  .modal-box h2 { margin-bottom:20px; }
  .roulette {
    position:relative; height:110px; overflow:hidden;
    background:#0a0e1a; border-radius:12px; border:1px solid #26304d;
    margin-bottom:20px;
  }
  .roulette::before {
    content:''; position:absolute; left:50%; top:0; bottom:0;
    width:3px; background:#22d3ee; transform:translateX(-50%);
    z-index:2; box-shadow:0 0 15px #22d3ee;
  }
  .strip { display:flex; height:100%; align-items:center;
    transition:transform 4s cubic-bezier(.15,.9,.15,1); }
  .item {
    min-width:110px; height:90px; margin:0 5px; border-radius:10px;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; font-size:30px; background:#141b30;
    border:1px solid #26304d;
  }
  .item small { font-size:11px; color:#8b95b8; margin-top:4px; }
  .result { font-size:22px; font-weight:700; margin-bottom:20px; min-height:30px; }
  .win { color:#22d3ee; } .lose { color:#ef4444; }
  .close-btn {
    padding:12px 30px; border:none; border-radius:10px;
    background:#26304d; color:#fff; font-weight:600; cursor:pointer;
    transition:.2s;
  }
  .close-btn:hover { background:#313d61; }
  .close-btn:disabled { opacity:.5; cursor:not-allowed; }

  /* Мультиоткрытие — сетка результатов */
  .multi-grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
    gap:10px; margin-bottom:20px; max-height:400px; overflow-y:auto;
    padding:5px;
  }
  .multi-item {
    background:#0a0e1a; border:2px solid #26304d; border-radius:12px;
    padding:12px 6px; display:flex; flex-direction:column;
    align-items:center; gap:6px;
    animation: popIn .35s ease backwards;
  }
  .multi-item .em { font-size:32px; }
  .multi-item .val { font-size:13px; font-weight:700; }
  .multi-item.win { border-color:#22d3ee; box-shadow:0 0 15px rgba(34,211,238,.3); }
  .multi-item.win .val { color:#22d3ee; }
  .multi-item.lose { border-color:#7a2a2a; }
  .multi-item.lose .val { color:#ef4444; }
  @keyframes popIn {
    0% { transform: scale(0.5); opacity:0; }
    100% { transform: scale(1); opacity:1; }
  }
  .total-line {
    font-size:20px; font-weight:800; margin-bottom:18px;
    background:linear-gradient(90deg,#22d3ee,#7c5cff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* Уведомления */
  .toast {
    position:fixed; top:24px; left:50%;
    transform:translate(-50%, -120px);
    display:flex; align-items:center; gap:12px;
    padding:16px 24px; border-radius:16px;
    font-weight:700; font-size:15px; z-index:999;
    background:linear-gradient(135deg, #1e2742, #141b30);
    border:1px solid #ef4444;
    color:#fff;
    box-shadow:0 15px 40px rgba(239,68,68,.35);
    opacity:0; pointer-events:none;
    transition:transform .4s cubic-bezier(.2,1.2,.4,1), opacity .3s ease;
    max-width:calc(100% - 40px);
  }
  .toast.show { transform:translate(-50%, 0); opacity:1; }
  .toast .icon {
    width:38px; height:38px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#ef4444,#b91c1c);
    border-radius:12px; font-size:20px;
    box-shadow:0 5px 15px rgba(239,68,68,.4);
  }
  .toast.success { border-color:#22d3ee; box-shadow:0 15px 40px rgba(34,211,238,.35); }
  .toast.success .icon {
    background:linear-gradient(135deg,#22d3ee,#0ea5e9);
    box-shadow:0 5px 15px rgba(34,211,238,.4);
  }
  .toast.info { border-color:#f59e0b; box-shadow:0 15px 40px rgba(245,158,11,.35); }
  .toast.info .icon {
    background:linear-gradient(135deg,#f59e0b,#ef4444);
    box-shadow:0 5px 15px rgba(245,158,11,.4);
  }

  @media(max-width:600px){
    .logo{font-size:22px;} .balance{font-size:15px;padding:10px 16px;}
    .toast{font-size:14px; padding:14px 18px;}
    .top-panel { padding:12px; }
    .chip { padding:7px 11px; font-size:13px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🎁 Reward Centre</div>
  <div class="balance">Баланс: <span id="balance">1000</span> ₽</div>
</header>

<!-- Панель управления -->
<div class="top-panel">
  <div class="group">
    <span class="label">⚡ Апгрейд:</span>
    <div class="chip active" data-up="1">x1</div>
    <div class="chip" data-up="1.5">x1.5</div>
    <div class="chip" data-up="2">x2</div>
    <div class="chip" data-up="5">x5</div>
    <div class="chip gold" data-up="10">x10</div>
  </div>
  <div class="group">
    <span class="label">🎲 Открыть сразу:</span>
    <div class="chip active" data-count="1">1</div>
    <div class="chip" data-count="2">2</div>
    <div class="chip" data-count="3">3</div>
    <div class="chip" data-count="5">5</div>
    <div class="chip" data-count="10">10</div>
  </div>
</div>

<main class="cases" id="cases"></main>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">Открытие кейса</h2>
    <div class="roulette" id="rouletteWrap"><div class="strip" id="strip"></div></div>
    <div class="multi-grid" id="multiGrid" style="display:none"></div>
    <div class="total-line" id="totalLine" style="display:none"></div>
    <div class="result" id="result"></div>
    <button class="close-btn" id="closeBtn" disabled>Забрать</button>
  </div>
</div>

<script>
const START_BALANCE = 1000;

/* Базовый шанс выигрыша 75%, апгрейд снижает шанс но увеличивает приз */
const UPGRADES = {
  1:   { chance: 0.75, mult: 1   },
  1.5: { chance: 0.75, mult: 1.5 },  // x1.5 — 75%
  2:   { chance: 0.50, mult: 2   },  // x2   — 50%
  5:   { chance: 0.25, mult: 5   },  // x5   — 25%
  10:  { chance: 0.10, mult: 10  },  // x10  — 10%
};

const CASES = [
  {name:"Новичок",        emoji:"📦", price:50,   min:10,  max:120},
  {name:"Бронза",         emoji:"🥉", price:100,  min:20,  max:250},
  {name:"Серебро",        emoji:"🥈", price:200,  min:40,  max:500},
  {name:"Золото",         emoji:"🥇", price:350,  min:80,  max:900},
  {name:"Платина",        emoji:"💎", price:500,  min:120, max:1300},
  {name:"Алмаз",          emoji:"💠", price:750,  min:200, max:2000},
  {name:"Изумруд",        emoji:"💚", price:1000, min:300, max:2700},
  {name:"Сапфир",         emoji:"🔷", price:1300, min:400, max:3500},
  {name:"Рубин",          emoji:"❤️", price:1600, min:500, max:4300},
  {name:"Аметист",        emoji:"💜", price:2000, min:600, max:5400},
  {name:"Топаз",          emoji:"🧡", price:2500, min:800, max:6800},
  {name:"Оникс",          emoji:"🖤", price:3000, min:1000,max:8100},
  {name:"Лазурит",        emoji:"🔵", price:3600, min:1200,max:9700},
  {name:"Малахит",        emoji:"🟢", price:4300, min:1500,max:11600},
  {name:"Обсидиан",       emoji:"⬛", price:5100, min:1800,max:13800},
  {name:"Кварц",          emoji:"⚪", price:6000, min:2100,max:16200},
  {name:"Гранат",         emoji:"🍎", price:7000, min:2500,max:18900},
  {name:"Циркон",         emoji:"✨", price:8200, min:2900,max:22100},
  {name:"Хризолит",       emoji:"🍋", price:9600, min:3400,max:25900},
  {name:"Аквамарин",      emoji:"💧", price:11000,min:3900,max:29700},
  {name:"Турмалин",       emoji:"🌈", price:13000,min:4600,max:35100},
  {name:"Флюорит",        emoji:"🔮", price:15000,min:5300,max:40500},
  {name:"Опал",           emoji:"🌌", price:17500,min:6200,max:47200},
  {name:"Пирит",          emoji:"🥇", price:20000,min:7100,max:54000},
  {name:"Метеорит",       emoji:"☄️", price:23000,min:8200,max:62100},
  {name:"Лунный камень",  emoji:"🌙", price:26000,min:9300,max:70200},
  {name:"Солнечный камень",emoji:"☀️",price:30000,min:10700,max:81000},
  {name:"Комета",         emoji:"🌠", price:35000,min:12500,max:94500},
  {name:"Галактика",      emoji:"🌌", price:40000,min:14300,max:108000},
  {name:"Reward Centre",  emoji:"👑", price:50000,min:18000,max:135000},
];

/* Состояние */
let balance = Number(localStorage.getItem("rc_balance"));
if (!balance || isNaN(balance)) balance = START_BALANCE;

let currentUpgrade = 1;   // текущий апгрейд
let currentCount   = 1;   // сколько кейсов открывать за раз

const $bal = document.getElementById("balance");
const $cases = document.getElementById("cases");
const $modal = document.getElementById("modal");
const $strip = document.getElementById("strip");
const $result = document.getElementById("result");
const $close = document.getElementById("closeBtn");
const $title = document.getElementById("modalTitle");
const $rouletteWrap = document.getElementById("rouletteWrap");
const $multiGrid = document.getElementById("multiGrid");
const $totalLine = document.getElementById("totalLine");

/* ============ Уведомления ============ */
let toastTimer = null;
function showToast(text, type = "error") {
  let t = document.querySelector(".toast");
  if (!t) {
    t = document.createElement("div");
    t.className = "toast";
    document.body.appendChild(t);
  }
  const icons = { error:"⚠️", success:"💸", info:"⚡" };
  t.className = "toast" + (type === "success" ? " success" : type === "info" ? " info" : "");
  t.innerHTML = `<div class="icon">${icons[type]}</div><div>${text}</div>`;
  t.classList.remove("show");
  void t.offsetWidth;
  requestAnimationFrame(() => t.classList.add("show"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
}

function save() { localStorage.setItem("rc_balance", balance); }
function renderBalance() { $bal.textContent = balance.toLocaleString("ru-RU"); }

/* ============ Рендер кейсов ============ */
function renderCases() {
  $cases.innerHTML = "";
  CASES.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "case";
    div.innerHTML = `
      <div class="emoji">${c.emoji}</div>
      <h3>${c.name}</h3>
      <div class="price">Цена: ${c.price.toLocaleString("ru-RU")} ₽</div>
      <div class="btn-row">
        <button data-i="${i}">Открыть</button>
        <button class="fast" data-fast="${i}" title="Быстро открыть">⚡</button>
      </div>
    `;
    div.querySelector("button[data-i]").addEventListener("click", () => openCase(i, false));
    div.querySelector("button[data-fast]").addEventListener("click", () => openCase(i, true));
    $cases.appendChild(div);
  });
}

/* ============ Логика ============ */
function randWin(min, max) {
  return Math.floor(min + Math.random() * (max - min));
}

/* Открыть 1 кейс — вернуть {prize, win} */
function rollCase(c) {
  const up = UPGRADES[currentUpgrade];
  const win = Math.random() < up.chance;
  let prize;
  if (win) prize = Math.floor(randWin(c.min, c.max) * up.mult);
  else prize = Math.floor(c.price * (0.2 + Math.random() * 0.4));
  return { prize, win };
}

/* Рулетка для одиночного открытия */
function buildStrip(c, prize) {
  const items = [];
  for (let i = 0; i < 40; i++) {
    const p = Math.floor(c.min + Math.random() * (c.max - c.min));
    items.push({ emoji: c.emoji, text: p.toLocaleString("ru-RU") + "₽" });
  }
  items[33] = { emoji: "💸", text: prize.toLocaleString("ru-RU") + "₽" };

  $strip.innerHTML = "";
  items.forEach(it => {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `${it.emoji}<small>${it.text}</small>`;
    $strip.appendChild(el);
  });
  return 33;
}

/* Главная функция */
function openCase(idx, fast = false) {
  const c = CASES[idx];
  const count = currentCount;
  const totalPrice = c.price * count;

  if (balance < totalPrice) {
    showToast(`Недостаточно средств! Нужно ${totalPrice.toLocaleString("ru-RU")} ₽`);
    return;
  }
  balance -= totalPrice;
  save(); renderBalance();

  // Списываем деньги и считаем результаты
  const results = [];
  for (let i = 0; i < count; i++) results.push(rollCase(c));

  /* ---- БЫСТРОЕ ОТКРЫТИЕ или МУЛЬТИОТКРЫТИЕ ---- */
  if (fast || count > 1) {
    showMultiResults(c, results, fast);
    return;
  }

  /* ---- ОДИНОЧНОЕ ОТКРЫТИЕ с рулеткой ---- */
  const prize = results[0].prize;
  $title.textContent = `Открытие: ${c.name} (x${currentUpgrade})`;
  $result.textContent = "";
  $result.className = "result";
  $close.disabled = true;
  $multiGrid.style.display = "none";
  $totalLine.style.display = "none";
  $rouletteWrap.style.display = "block";
  $modal.classList.add("show");

  const winIdx = buildStrip(c, prize);
  $strip.style.transition = "none";
  $strip.style.transform = "translateX(0)";
  void $strip.offsetWidth;

  const itemW = 120;
  const offset = winIdx * itemW - ($rouletteWrap.offsetWidth / 2 - itemW / 2);

  requestAnimationFrame(() => {
    $strip.style.transition = "transform 4s cubic-bezier(.15,.9,.15,1)";
    $strip.style.transform = `translateX(-${offset}px)`;
  });

  setTimeout(() => {
    balance += prize;
    save(); renderBalance();
    if (prize >= c.price) {
      $result.textContent = `🎉 Выигрыш: +${prize.toLocaleString("ru-RU")} ₽`;
      $result.classList.add("win");
      showToast(`+${prize.toLocaleString("ru-RU")} ₽`, "success");
    } else {
      $result.textContent = `😔 Возврат: +${prize.toLocaleString("ru-RU")} ₽`;
      $result.classList.add("lose");
    }
    $close.disabled = false;
  }, 4100);
}

/* Мультирезультат / быстрое открытие */
function showMultiResults(c, results, instant) {
  $title.textContent = instant
    ? `⚡ Быстро: ${c.name} ×${results.length}`
    : `Открытие: ${c.name} ×${results.length}`;

  $rouletteWrap.style.display = "none";
  $multiGrid.style.display = "grid";
  $totalLine.style.display = "block";
  $result.textContent = "";
  $result.className = "result";
  $close.disabled = true;
  $modal.classList.add("show");

  $multiGrid.innerHTML = "";
  let total = 0;
  results.forEach((r, i) => {
    total += r.prize;
    const el = document.createElement("div");
    el.className = "multi-item " + (r.win ? "win" : "lose");
    el.style.animationDelay = (instant ? i * 0.02 : i * 0.06) + "s";
    el.innerHTML = `
      <div class="em">${r.win ? "💸" : c.emoji}</div>
      <div class="val">+${r.prize.toLocaleString("ru-RU")}</div>
    `;
    $multiGrid.appendChild(el);
  });

  balance += total;
  save(); renderBalance();

  const spent = c.price * results.length;
  const diff = total - spent;
  $totalLine.textContent = `Итого: +${total.toLocaleString("ru-RU")} ₽  (${diff >= 0 ? "+" : ""}${diff.toLocaleString("ru-RU")} ₽)`;

  if (total >= spent) {
    showToast(`+${total.toLocaleString("ru-RU")} ₽ выигрыш!`, "success");
  } else {
    showToast(`Возврат +${total.toLocaleString("ru-RU")} ₽`, "info");
  }

  $close.disabled = false;
}

/* ============ UI: апгрейд и количество ============ */
document.querySelectorAll(".chip[data-up]").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip[data-up]").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    currentUpgrade = Number(chip.dataset.up);
    const up = UPGRADES[currentUpgrade];
    showToast(`Апгрейд x${currentUpgrade} — шанс ${(up.chance*100).toFixed(0)}%`, "info");
  });
});

document.querySelectorAll(".chip[data-count]").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip[data-count]").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    currentCount = Number(chip.dataset.count);
  });
});

$close.addEventListener("click", () => {
  $modal.classList.remove("show");
});

renderBalance();
renderCases();
</script>
</body>
</html>
